name: Ping API

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping endpoints every 29 seconds
        run: |
          for i in {1..2}
          do
            echo "===== Ping $i ====="

            curl -fsS https://mileage-app.onrender.com/api/health
            curl -fsS https://mileage-app-1.onrender.com/api/health
            curl -fsS https://mileage-app-2.onrender.com/api/health
            curl -fsS https://mileage-app-3.onrender.com/api/health

            if [ "$i" -lt 2 ]; then
              echo "Waiting 29 seconds..."
              sleep 29
            fi
          done
