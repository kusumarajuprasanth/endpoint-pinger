on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping endpoint every 29 seconds
        run: |
          for i in {1..2}; do
            echo "===== Ping $i at $(date -u) ====="

            curl -fsS --max-time 10 \
              https://mileage-app.onrender.com/api/health \
              || echo "Curl failed, continuing to next iteration"

            if [ "$i" -lt 2 ]; then
              echo -e "\n -> Waiting 29 seconds..."
              sleep 29
            fi
          done
